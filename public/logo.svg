<svg
    width="100"
    height="100"
    viewBox="0 0 100 100"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Sisi kiri -->
    <path
        d="M50 15 L15 35 L15 65 L50 45 Z"
        fill="url(#box-left)"
        opacity="0.7"/>

    <!-- Logo -->
    <path
        d="M50 15
           L85 35
           L50 52
           L15 35
           L15 65
           L50 85
           L85 65
           L85 50
           M50 52
           L50 85"
        stroke="url(#neon-purple)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <circle
        cx="50"
        cy="52"
        r="4"
        fill="#E9D5FF"/>

    <defs>

        <linearGradient
            id="neon-purple"
            x1="15"
            y1="15"
            x2="85"
            y2="85"
            gradientUnits="userSpaceOnUse">

            <stop stop-color="#D8B4FE"/>
            <stop offset="0.3" stop-color="#A855F7"/>
            <stop offset="1" stop-color="#6B21A8"/>

        </linearGradient>

        <linearGradient
            id="box-left"
            x1="15"
            y1="15"
            x2="50"
            y2="65"
            gradientUnits="userSpaceOnUse">

            <stop stop-color="#A855F7" stop-opacity="0.15"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>

        </linearGradient>

    </defs>

</svg>